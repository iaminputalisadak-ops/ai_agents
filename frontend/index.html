<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>AI Voice Agent</h1>
      <p class="subtitle">Your intelligent voice assistant</p>
    </header>

    <!-- Main Container -->
    <main class="container">
      <!-- Chat Area -->
      <section class="chat-section">
        <div class="chat-header">
          <h2>Conversation</h2>
          <div class="chat-actions">
            <button id="clearBtn" class="btn-icon" title="Clear history">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              Clear
            </button>
          </div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
      </section>

      <!-- Voice & Input Area -->
      <section class="input-section">
        <div class="voice-area">
          <div id="voiceVisualizer" class="voice-visualizer">
            <button id="voiceBtn" class="voice-btn" title="Click to speak" aria-label="Voice input">
              <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
          </div>
          <p id="voiceStatus" class="voice-status">Click to speak</p>
        </div>

        <div class="text-input-area">
          <input type="text" id="textInput" placeholder="Or type your message here..." autocomplete="off">
          <button id="sendBtn" class="btn-send">Send</button>
        </div>
      </section>
    </main>

    <!-- Settings Button -->
    <button id="settingsBtn" class="btn-settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="closeSettings" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label for="voiceSpeed">Voice Speed</label>
            <input type="range" id="voiceSpeed" min="100" max="250" value="175">
            <span id="speedValue">175</span> wpm
          </div>
          <div class="setting-group">
            <label for="voiceVolume">Volume</label>
            <input type="range" id="voiceVolume" min="0" max="100" value="100">
            <span id="volumeValue">100</span>%
          </div>
          <div class="setting-group">
            <label for="voiceSelect">Voice</label>
            <select id="voiceSelect"></select>
          </div>
          <div class="setting-group">
            <label>
              <input type="checkbox" id="continuousMode" checked>
              Continuous listening mode
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
